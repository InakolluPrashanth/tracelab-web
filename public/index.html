<script>

  /* ============================================================
     TRACE BACKEND
     ============================================================ */

  const TRACE_BACKEND =
    "https://tracelab-free.onrender.com";


  /* ============================================================
     DOM HELPERS
     ============================================================ */

  const $ = id => document.getElementById(id);

  const codeEl = $("code");
  const languageEl = $("language");
  const outputEl = $("output");
  const statusEl = $("status");
  const runBtn = $("run");
  const resetBtn = $("reset");
  const lineNumbersEl = $("lineNumbers");

  const flowNodes =
    Array.from(document.querySelectorAll(".flow-node"));


  /* ============================================================
     STATE
     ============================================================ */

  let steps = [];
  let currentStep = 0;
  let playTimer = null;

  let detectedAlgorithm = "Generic Program";
  let detectedData = [];
  let detectedTarget = null;


  /* ============================================================
     DEFAULT C++
     ============================================================ */

  const DEFAULT_CODE = `#include <iostream>
using namespace std;

int main() {
    int sum = 0;

    for (int i = 1; i <= 5; i++) {
        sum += i;
    }

    cout << sum;
    return 0;
}`;


  /* ============================================================
     LANGUAGE FILE NAMES
     ============================================================ */

  const FILE_NAMES = {
    html: "index.html",
    css: "style.css",
    python: "main.py",
    javascript: "main.js",
    typescript: "main.ts",
    c: "main.c",
    cpp: "main.cpp",
    java: "Main.java",
    go: "main.go",
    kotlin: "Main.kt",
    swift: "main.swift",
    ruby: "main.rb",
    php: "index.php",
    perl: "main.pl",
    bash: "script.sh",
    sql: "query.sql"
  };


  /* ============================================================
     LINE NUMBERS
     ============================================================ */

  function updateLineNumbers() {

    const count =
      codeEl.value.split("\n").length;

    let text = "";

    for (let i = 1; i <= count; i++) {
      text += i + "\n";
    }

    lineNumbersEl.textContent = text;
  }


  codeEl.addEventListener(
    "input",
    updateLineNumbers
  );


  codeEl.addEventListener(
    "scroll",
    () => {
      lineNumbersEl.scrollTop =
        codeEl.scrollTop;
    }
  );


  updateLineNumbers();


  /* ============================================================
     FILENAME
     ============================================================ */

  function updateFilename() {

    const language =
      languageEl.value;

    $("filename").textContent =
      FILE_NAMES[language] || "main.txt";
  }


  languageEl.addEventListener(
    "change",
    () => {

      updateFilename();

      const mismatch =
        detectLanguageMismatch(
          codeEl.value,
          languageEl.value
        );

      if (mismatch) {

        statusEl.textContent =
          "⚠ " + mismatch;

      } else {

        statusEl.textContent =
          "● Language: " +
          languageEl.options[
            languageEl.selectedIndex
          ].text;
      }

    }
  );


  updateFilename();


  /* ============================================================
     BACKEND HEALTH CHECK
     ============================================================ */

  async function checkBackend() {

    statusEl.textContent =
      "● Checking backend…";

    const controller =
      new AbortController();

    const timeout =
      setTimeout(
        () => controller.abort(),
        10000
      );

    try {

      const response =
        await fetch(
          TRACE_BACKEND + "/api/health",
          {
            method: "GET",
            signal: controller.signal,
            cache: "no-store"
          }
        );

      clearTimeout(timeout);

      if (!response.ok) {
        throw new Error(
          "Backend returned HTTP " +
          response.status
        );
      }

      const data =
        await response.json();

      if (data && data.ok !== false) {

        statusEl.textContent =
          "● Backend online";

      } else {

        statusEl.textContent =
          "● Backend reachable";
      }

    } catch (error) {

      clearTimeout(timeout);

      statusEl.textContent =
        "● Browser ready — backend may be sleeping";
    }
  }


  checkBackend();


  /* ============================================================
     LANGUAGE AUTO DETECTION
     ============================================================ */

  function detectLanguage(code) {

    const text =
      code.toLowerCase();


    if (
      /<!doctype\s+html/i.test(code) ||
      /<html[\s>]/i.test(code)
    ) {
      return "html";
    }


    if (
      /#include\s*<iostream>/i.test(code) ||
      /\busing\s+namespace\s+std\s*;/i.test(code) ||
      /\bcout\s*<</i.test(code) ||
      /\bcin\s*>>/i.test(code)
    ) {
      return "cpp";
    }


    if (
      /#include\s*<stdio\.h>/i.test(code) ||
      /\bprintf\s*\(/i.test(code) ||
      /\bscanf\s*\(/i.test(code)
    ) {
      return "c";
    }


    if (
      /\bpublic\s+static\s+void\s+main\s*\(/i.test(code) ||
      /\bSystem\.out\.(println|print)\s*\(/i.test(code)
    ) {
      return "java";
    }


    if (
      /\bpackage\s+main\b/i.test(code) ||
      /\bfmt\.(Println|Printf|Print)\s*\(/i.test(code)
    ) {
      return "go";
    }


    if (
      /\bdef\s+\w+\s*\(/i.test(code) ||
      /\bprint\s*\(/i.test(code) ||
      /^\s*import\s+\w+/im.test(code)
    ) {
      return "python";
    }


    if (
      /\bconsole\.log\s*\(/i.test(code) ||
      /\b(const|let|var)\s+\w+/i.test(code) ||
      /=>/.test(code)
    ) {
      return "javascript";
    }


    if (
      /\binterface\s+\w+/i.test(code) ||
      /\btype\s+\w+\s*=/i.test(code)
    ) {
      return "typescript";
    }


    if (
      /\bfun\s+main\s*\(/i.test(code) ||
      /\bval\s+\w+/i.test(code) ||
      /\bvar\s+\w+/i.test(code)
    ) {
      return "kotlin";
    }


    if (
      /\bfunc\s+main\s*\(/i.test(code) ||
      /\bimport\s+Foundation\b/i.test(code)
    ) {
      return "swift";
    }


    if (
      /\bputs\s+/i.test(code) ||
      /\bdef\s+\w+/i.test(code) &&
      /\bend\b/i.test(code)
    ) {
      return "ruby";
    }


    if (
      /<\?php/i.test(code)
    ) {
      return "php";
    }


    if (
      /\buse\s+strict\b/i.test(code) ||
      /\bmy\s+\$\w+/i.test(code)
    ) {
      return "perl";
    }


    if (
      /^\s*#!/m.test(code) ||
      /\becho\s+["']/i.test(code)
    ) {
      return "bash";
    }


    if (
      /\b(select|insert\s+into|update\s+\w+\s+set|delete\s+from)\b/i.test(code)
    ) {
      return "sql";
    }


    return null;
  }


  /* ============================================================
     LANGUAGE MISMATCH DETECTOR
     ============================================================ */

  function detectLanguageMismatch(
    code,
    selectedLanguage
  ) {

    if (!code.trim()) {
      return null;
    }


    const detected =
      detectLanguage(code);


    if (!detected) {
      return null;
    }


    if (detected === selectedLanguage) {
      return null;
    }


    const languageNames = {

      html: "HTML",
      css: "CSS",
      python: "Python",
      javascript: "JavaScript",
      typescript: "TypeScript",
      c: "C",
      cpp: "C++",
      java: "Java",
      go: "Go",
      kotlin: "Kotlin",
      swift: "Swift",
      ruby: "Ruby",
      php: "PHP",
      perl: "Perl",
      bash: "Bash",
      sql: "SQL"

    };


    return (
      "Language mismatch — selected " +
      languageNames[selectedLanguage] +
      ", but the code appears to be " +
      languageNames[detected] +
      ". Please select " +
      languageNames[detected] +
      " or change your code."
    );
  }


  /* ============================================================
     AUTO DETECT BUTTON
     ============================================================ */

  $("autoDetect").addEventListener(
    "click",
    () => {

      const detected =
        detectLanguage(codeEl.value);

      if (!detected) {

        statusEl.textContent =
          "● Language could not be detected";

        return;
      }


      languageEl.value =
        detected;

      updateFilename();


      const name =
        languageEl.options[
          languageEl.selectedIndex
        ].text;


      statusEl.textContent =
        "● Detected " + name;
    }
  );


  /* ============================================================
     ARRAY EXTRACTION
     ============================================================ */

  function extractArray(code) {

    let match;


    /*
      Python / JavaScript

      arr = [5, 2, 8, 1]
    */

    match =
      code.match(
        /(?:arr|array|numbers|data|values|nums)\s*=\s*\[([^\]]+)\]/i
      );


    if (match) {

      const values =
        match[1]
          .split(",")
          .map(x => x.trim())
          .filter(
            x => /^-?\d+(\.\d+)?$/.test(x)
          )
          .map(Number);

      if (values.length) {
        return values;
      }
    }


    /*
      C / C++

      int arr[] = {5,2,8,1};
    */

    match =
      code.match(
        /(?:arr|array|numbers|data|values|nums)\s*\[\s*\]\s*=\s*\{([^}]+)\}/i
      );


    if (match) {

      const values =
        match[1]
          .split(",")
          .map(x => x.trim())
          .filter(
            x => /^-?\d+(\.\d+)?$/.test(x)
          )
          .map(Number);

      if (values.length) {
        return values;
      }
    }


    /*
      Generic initializer
    */

    match =
      code.match(
        /\{\s*(-?\d+(?:\s*,\s*-?\d+)+)\s*\}/
      );


    if (match) {

      const values =
        match[1]
          .split(",")
          .map(Number);

      if (values.length) {
        return values;
      }
    }


    return [];
  }


  /* ============================================================
     TARGET EXTRACTION
     ============================================================ */

  function extractTarget(code) {

    const patterns = [

      /target\s*=\s*(-?\d+)/i,

      /search(?:For|Value|Key)?\s*=\s*(-?\d+)/i,

      /key\s*=\s*(-?\d+)/i,

      /find\s*=\s*(-?\d+)/i

    ];


    for (const pattern of patterns) {

      const match =
        code.match(pattern);

      if (match) {
        return Number(match[1]);
      }
    }


    return null;
  }


  /* ============================================================
     ALGORITHM DETECTION
     ============================================================ */

  function detectAlgorithm(code) {

    const text =
      code.toLowerCase();


    /*
      BUBBLE SORT
    */

    if (
      (
        text.includes("bubble") ||
        (
          /j\s*\+\s*1/.test(text) &&
          (
            text.includes("swap") ||
            text.includes("temp")
          )
        )
      ) &&
      (
        text.includes("arr") ||
        text.includes("array") ||
        detectedData.length > 0
      )
    ) {
      return "Bubble Sort";
    }


    /*
      SELECTION SORT
    */

    if (
      text.includes("selection sort") ||
      (
        text.includes("minindex") &&
        text.includes("swap")
      )
    ) {
      return "Selection Sort";
    }


    /*
      INSERTION SORT
    */

    if (
      text.includes("insertion sort") ||
      (
        text.includes("key") &&
        /j\s*>=/.test(text) &&
        /arr\s*\[\s*j\s*\+\s*1\s*\]/.test(text)
      )
    ) {
      return "Insertion Sort";
    }


    /*
      BINARY SEARCH
    */

    if (
      text.includes("binary search") ||
      (
        text.includes("mid") &&
        text.includes("low") &&
        text.includes("high") &&
        (
          text.includes("target") ||
          text.includes("key")
        )
      )
    ) {
      return "Binary Search";
    }


    /*
      STACK
    */

    if (
      text.includes("stack") ||
      (
        text.includes("push") &&
        text.includes("pop")
      )
    ) {
      return "Stack";
    }


    /*
      QUEUE
    */

    if (
      text.includes("queue") ||
      text.includes("enqueue") ||
      text.includes("dequeue")
    ) {
      return "Queue";
    }


    /*
      LINKED LIST
    */

    if (
      text.includes("linked list") ||
      (
        text.includes("next") &&
        text.includes("node")
      )
    ) {
      return "Linked List";
    }


    /*
      BINARY TREE
    */

    if (
      text.includes("binary tree") ||
      text.includes("treenode") ||
      (
        text.includes("left") &&
        text.includes("right") &&
        text.includes("node")
      )
    ) {
      return "Binary Tree";
    }


    /*
      BFS
    */

    if (
      text.includes("bfs") ||
      text.includes("breadth first")
    ) {
      return "BFS";
    }


    /*
      DFS
    */

    if (
      text.includes("dfs") ||
      text.includes("depth first")
    ) {
      return "DFS";
    }


    /*
      LINEAR SEARCH
    */

    if (
      text.includes("linear search") ||
      (
        (
          text.includes("target") ||
          text.includes("key")
        ) &&
        (
          text.includes("for") ||
          text.includes("while")
        ) &&
        (
          text.includes("arr") ||
          text.includes("array")
        )
      )
    ) {
      return "Linear Search";
    }


    return "Generic Program";
  }


  /* ============================================================
     BUBBLE SORT TRACE
     ============================================================ */

  function createBubbleSortSteps(arr) {

    const trace = [];

    const a = [...arr];


    trace.push({
      title: "Start Bubble Sort",
      description:
        "The array is ready. Bubble Sort compares adjacent values.",
      line: 1,
      type: "start",
      array: [...a]
    });


    for (
      let i = 0;
      i < a.length - 1;
      i++
    ) {

      trace.push({
        title:
          "Start pass " + (i + 1),
        description:
          "A new pass begins through the unsorted portion.",
        type: "loop",
        array: [...a]
      });


      for (
        let j = 0;
        j < a.length - i - 1;
        j++
      ) {

        trace.push({
          title:
            "Compare " +
            a[j] +
            " and " +
            a[j + 1],
          description:
            "Bubble Sort compares adjacent elements.",
          type: "compare",
          array: [...a],
          active: [j, j + 1]
        });


        if (a[j] > a[j + 1]) {

          const left = a[j];
          const right = a[j + 1];

          [
            a[j],
            a[j + 1]
          ] = [
            a[j + 1],
            a[j]
          ];


          trace.push({
            title:
              "Swap " +
              left +
              " and " +
              right,
            description:
              "The larger value moves toward the end of the array.",
            type: "swap",
            array: [...a],
            active: [j, j + 1]
          });

        } else {

          trace.push({
            title:
              "No swap needed",
            description:
              "The adjacent values are already in the correct order.",
            type: "compare",
            array: [...a],
            active: [j, j + 1]
          });
        }
      }
    }


    trace.push({
      title: "Sorting complete",
      description:
        "Bubble Sort has finished. The array is sorted.",
      type: "output",
      array: [...a]
    });


    return trace;
  }


  /* ============================================================
     SELECTION SORT TRACE
     ============================================================ */

  function createSelectionSortSteps(arr) {

    const trace = [];

    const a = [...arr];


    for (
      let i = 0;
      i < a.length - 1;
      i++
    ) {

      let min = i;


      trace.push({
        title:
          "Select position " + i,
        description:
          "Search for the smallest remaining value.",
        type: "loop",
        array: [...a],
        active: [i]
      });


      for (
        let j = i + 1;
        j < a.length;
        j++
      ) {

        trace.push({
          title:
            "Compare " +
            a[min] +
            " and " +
            a[j],
          description:
            "Selection Sort searches for the minimum value.",
          type: "compare",
          array: [...a],
          active: [min, j]
        });


        if (a[j] < a[min]) {
          min = j;
        }
      }


      if (min !== i) {

        [
          a[i],
          a[min]
        ] = [
          a[min],
          a[i]
        ];


        trace.push({
          title:
            "Move minimum to position " + i,
          description:
            "The smallest remaining value is placed at its final position.",
          type: "swap",
          array: [...a],
          active: [i, min]
        });
      }
    }


    trace.push({
      title: "Sorting complete",
      description:
        "Selection Sort has finished.",
      type: "output",
      array: [...a]
    });


    return trace;
  }


  /* ============================================================
     INSERTION SORT TRACE
     ============================================================ */

  function createInsertionSortSteps(arr) {

    const trace = [];

    const a = [...arr];


    trace.push({
      title: "Start Insertion Sort",
      description:
        "The first element is treated as a sorted portion.",
      type: "start",
      array: [...a]
    });


    for (
      let i = 1;
      i < a.length;
      i++
    ) {

      const key = a[i];

      let j = i - 1;


      trace.push({
        title:
          "Select " + key,
        description:
          "Take the next value and find its correct position.",
        type: "process",
        array: [...a],
        active: [i]
      });


      while (
        j >= 0 &&
        a[j] > key
      ) {

        trace.push({
          title:
            "Shift " + a[j],
          description:
            "A larger value moves one position to the right.",
          type: "update",
          array: [...a],
          active: [j, j + 1]
        });


        a[j + 1] = a[j];

        j--;
      }


      a[j + 1] = key;


      trace.push({
        title:
          "Insert " + key,
        description:
          "The selected value is inserted into its correct position.",
        type: "update",
        array: [...a],
        active: [j + 1]
      });
    }


    trace.push({
      title: "Sorting complete",
      description:
        "Insertion Sort has finished.",
      type: "output",
      array: [...a]
    });


    return trace;
  }


  /* ============================================================
     BINARY SEARCH TRACE
     ============================================================ */

  function createBinarySearchSteps(
    arr,
    target
  ) {

    const trace = [];

    const a =
      [...arr].sort(
        (x, y) => x - y
      );


    if (target === null) {

      target =
        a.length
          ? a[Math.floor(a.length / 2)]
          : null;
    }


    let low = 0;

    let high =
      a.length - 1;


    trace.push({
      title: "Start Binary Search",
      description:
        "Binary Search works on a sorted array.",
      type: "start",
      array: [...a],
      low,
      high,
      target
    });


    while (low <= high) {

      const mid =
        Math.floor(
          (low + high) / 2
        );


      trace.push({
        title:
          "Check middle = " +
          a[mid],
        description:
          "Compare the target with the middle element.",
        type: "compare",
        array: [...a],
        active: [mid],
        low,
        mid,
        high,
        target
      });


      if (a[mid] === target) {

        trace.push({
          title:
            "Target found",
          description:
            target +
            " was found at index " +
            mid +
            ".",
          type: "found",
          array: [...a],
          active: [mid],
          low,
          mid,
          high,
          target
        });


        return trace;
      }


      if (a[mid] < target) {

        low = mid + 1;


        trace.push({
          title:
            "Move low to " + low,
          description:
            "The target is larger, so the left half is discarded.",
          type: "update",
          array: [...a],
          active: [mid],
          low,
          high,
          target
        });

      } else {

        high = mid - 1;


        trace.push({
          title:
            "Move high to " + high,
          description:
            "The target is smaller, so the right half is discarded.",
          type: "update",
          array: [...a],
          active: [mid],
          low,
          high,
          target
        });
      }
    }


    trace.push({
      title:
        "Target not found",
      description:
        "The search range became empty.",
      type: "output",
      array: [...a],
      target
    });


    return trace;
  }


  /* ============================================================
     LINEAR SEARCH TRACE
     ============================================================ */

  function createLinearSearchSteps(
    arr,
    target
  ) {

    const trace = [];

    const a = [...arr];


    if (target === null) {

      target =
        a.length
          ? a[a.length - 1]
          : null;
    }


    trace.push({
      title: "Start Linear Search",
      description:
        "Linear Search checks each element from left to right.",
      type: "start",
      array: [...a],
      target
    });


    for (
      let i = 0;
      i < a.length;
      i++
    ) {

      trace.push({
        title:
          "Check index " + i,
        description:
          "Compare the current element with the target.",
        type: "compare",
        array: [...a],
        active: [i],
        target
      });


      if (a[i] === target) {

        trace.push({
          title:
            "Target found at index " + i,
          description:
            "The current value matches the target.",
          type: "found",
          array: [...a],
          active: [i],
          target
        });


        return trace;
      }
    }


    trace.push({
      title:
        "Target not found",
      description:
        "Every element was checked without finding the target.",
      type: "output",
      array: [...a],
      target
    });


    return trace;
  }


  /* ============================================================
     STACK TRACE
     ============================================================ */

  function createStackSteps(code) {

    const trace = [];

    let stack = [];

    const numbers =
      extractArray(code);


    trace.push({
      title: "Create Stack",
      description:
        "An empty stack is created. Stack follows LIFO.",
      type: "start",
      stack: []
    });


    if (numbers.length) {

      numbers.forEach(value => {

        stack.push(value);


        trace.push({
          title:
            "Push " + value,
          description:
            value +
            " is added to the top of the stack.",
          type: "push",
          stack: [...stack]
        });

      });


      const popped =
        stack.pop();


      trace.push({
        title:
          "Pop " + popped,
        description:
          "The top element is removed from the stack.",
        type: "pop",
        stack: [...stack]
      });

    } else {

      trace.push({
        title:
          "Push operation",
        description:
          "The stack is ready for push/pop operations.",
        type: "process",
        stack: []
      });
    }


    trace.push({
      title:
        "Stack complete",
      description:
        "The stack operations have finished.",
      type: "output",
      stack: [...stack]
    });


    return trace;
  }


  /* ============================================================
     QUEUE TRACE
     ============================================================ */

  function createQueueSteps(code) {

    const trace = [];

    let queue = [];

    const numbers =
      extractArray(code);


    trace.push({
      title:
        "Create Queue",
      description:
        "An empty queue is created. Queue follows FIFO.",
      type: "start",
      queue: []
    });


    if (numbers.length) {

      numbers.forEach(value => {

        queue.push(value);


        trace.push({
          title:
            "Enqueue " + value,
          description:
            value +
            " is added to the back of the queue.",
          type: "enqueue",
          queue: [...queue]
        });

      });


      const removed =
        queue.shift();


      trace.push({
        title:
          "Dequeue " + removed,
        description:
          "The first element is removed from the queue.",
        type: "dequeue",
        queue: [...queue]
      });
    }


    trace.push({
      title:
        "Queue complete",
      description:
        "The queue operations have finished.",
      type: "output",
      queue: [...queue]
    });


    return trace;
  }


  /* ============================================================
     LINKED LIST TRACE
     ============================================================ */

  function createLinkedListSteps(code) {

    const trace = [];

    const values =
      extractArray(code);


    const data =
      values.length
        ? values
        : [10, 20, 30];


    const list = [];


    trace.push({
      title:
        "Create Linked List",
      description:
        "The list starts with no nodes.",
      type: "start",
      list: []
    });


    data.forEach(value => {

      list.push(value);


      trace.push({
        title:
          "Create node " + value,
        description:
          "A new node is added to the linked list.",
        type: "process",
        list: [...list],
        active:
          [list.length - 1]
      });
    });


    trace.push({
      title:
        "Traverse list",
      description:
        "The list is traversed from the head node.",
      type: "output",
      list: [...list]
    });


    return trace;
  }


  /* ============================================================
     BINARY TREE TRACE
     ============================================================ */

  function createTreeSteps(code) {

    const trace = [];

    const values =
      extractArray(code);


    const data =
      values.length
        ? values.slice(0, 7)
        : [50, 30, 70, 20, 40, 60, 80];


    trace.push({
      title:
        "Create Binary Tree",
      description:
        "The first value becomes the root.",
      type: "start",
      tree: [data[0]]
    });


    const inserted = [data[0]];


    for (
      let i = 1;
      i < data.length;
      i++
    ) {

      inserted.push(
        data[i]
      );


      trace.push({
        title:
          "Insert " + data[i],
        description:
          "Compare the value with tree nodes and place it in the correct position.",
        type: "process",
        tree: [...inserted],
        active: [i]
      });
    }


    trace.push({
      title:
        "Tree traversal",
      description:
        "The binary tree is ready for traversal.",
      type: "output",
      tree: [...inserted]
    });


    return trace;
  }


  /* ============================================================
     BFS / DFS
     ============================================================ */

  function createGraphSteps(
    code,
    algorithm
  ) {

    const trace = [];

    const nodes =
      ["A", "B", "C", "D", "E"];


    trace.push({
      title:
        "Start " + algorithm,
      description:
        algorithm +
        " traversal begins from the starting node.",
      type: "start",
      graph: []
    });


    nodes.forEach(
      (node, index) => {

        trace.push({
          title:
            "Visit node " + node,
          description:
            algorithm +
            " visits the next reachable node.",
          type: "process",
          graph:
            nodes.slice(
              0,
              index + 1
            ),
          active: [index]
        });

      }
    );


    trace.push({
      title:
        algorithm + " complete",
      description:
        "Graph traversal has finished.",
      type: "output",
      graph: [...nodes]
    });


    return trace;
  }


  /* ============================================================
     GENERIC TRACE
     ============================================================ */

  function createGenericSteps(code) {

    const lines =
      code
        .split("\n")
        .map(
          (line, index) => ({
            text: line.trim(),
            line: index + 1
          })
        )
        .filter(
          x => x.text.length
        );


    const trace = [];


    trace.push({
      title:
        "Start program",
      description:
        "TraceLab begins analyzing your program.",
      line: 1,
      type: "start"
    });


    trace.push({
      title:
        "Analyze code",
      description:
        "The program structure and operations are inspected.",
      line:
        lines[0]?.line || null,
      type: "analyze"
    });


    const important =
      lines.filter(
        x =>
          /for|while|if|else|switch|case|push|pop|insert|delete|print|cout|printf|console\.log|return/i
            .test(x.text)
      );


    const selected =
      important.length
        ? important.slice(0, 5)
        : lines.slice(0, 5);


    selected.forEach(item => {

      trace.push({
        title:
          "Execute statement",
        description:
          item.text,
        line:
          item.line,
        type:
          /for|while/i.test(
            item.text
          )
            ? "loop"
            : "process"
      });

    });


    trace.push({
      title:
        "Show result",
      description:
        "The program has reached its output stage.",
      line:
        lines[
          lines.length - 1
        ]?.line || null,
      type:
        "output"
    });


    return trace;
  }


  /* ============================================================
     BUILD TRACE
     ============================================================ */

  function buildTrace(code) {

    detectedData =
      extractArray(code);

    detectedTarget =
      extractTarget(code);

    detectedAlgorithm =
      detectAlgorithm(code);


    switch (detectedAlgorithm) {

      case "Bubble Sort":

        return createBubbleSortSteps(
          detectedData.length
            ? detectedData
            : [5, 2, 8, 1, 4]
        );


      case "Selection Sort":

        return createSelectionSortSteps(
          detectedData.length
            ? detectedData
            : [5, 2, 8, 1, 4]
        );


      case "Insertion Sort":

        return createInsertionSortSteps(
          detectedData.length
            ? detectedData
            : [5, 2, 8, 1, 4]
        );


      case "Binary Search":

        return createBinarySearchSteps(
          detectedData.length
            ? detectedData
            : [1, 3, 5, 7, 9, 11, 13],
          detectedTarget
        );


      case "Linear Search":

        return createLinearSearchSteps(
          detectedData.length
            ? detectedData
            : [4, 8, 2, 9, 6],
          detectedTarget
        );


      case "Stack":
        return createStackSteps(code);


      case "Queue":
        return createQueueSteps(code);


      case "Linked List":
        return createLinkedListSteps(code);


      case "Binary Tree":
        return createTreeSteps(code);


      case "BFS":
      case "DFS":

        return createGraphSteps(
          code,
          detectedAlgorithm
        );


      default:

        return createGenericSteps(code);
    }
  }


  /* ============================================================
     FLOW STAGE
     ============================================================ */

  function getStage(step) {

    const type =
      step?.type || "process";


    if (type === "start") {
      return 0;
    }


    if (type === "analyze") {
      return 1;
    }


    if (
      type === "loop" ||
      type === "compare" ||
      type === "process" ||
      type === "push" ||
      type === "enqueue"
    ) {
      return 2;
    }


    if (
      type === "swap" ||
      type === "update" ||
      type === "pop" ||
      type === "dequeue"
    ) {
      return 3;
    }


    if (
      type === "found" ||
      type === "output"
    ) {
      return 4;
    }


    return 2;
  }


  /* ============================================================
     DSA RENDER
     ============================================================ */

  function renderDSA(step) {

    const view =
      $("dsaView");


    if (!step) {

      view.textContent =
        "No data.";

      return;
    }


    /* ARRAY */

    if (step.array) {

      let html =
        '<div class="array-view">';


      step.array.forEach(
        (value, index) => {

          const active =
            step.active &&
            step.active.includes(index);


          const found =
            step.type === "found" &&
            active;


          html += `
            <div class="array-item
              ${active ? "active" : ""}
              ${found ? "found" : ""}
            ">
              <span class="array-index">
                ${index}
              </span>
              ${value}
            </div>
          `;
        }
      );


      html +=
        "</div>";


      if (
        step.low !== undefined
      ) {

        html += `
          <div style="
            margin-top:12px;
            font-size:11px;
            color:#697386;
          ">
            low = ${step.low}
            &nbsp;&nbsp;
            mid = ${step.mid ?? "—"}
            &nbsp;&nbsp;
            high = ${step.high}
            ${
              step.target !== undefined
                ? `&nbsp;&nbsp; target = ${step.target}`
                : ""
            }
          </div>
        `;
      }


      view.innerHTML =
        html;

      return;
    }


    /* STACK */

    if (step.stack) {

      let html =
        '<div class="stack-view">';


      step.stack.forEach(
        value => {

          html += `
            <div class="stack-item">
              ${value}
            </div>
          `;
        }
      );


      html +=
        "</div>";


      html += `
        <div style="
          margin-top:8px;
          font-size:11px;
          color:#697386;
        ">
          TOP ↑
        </div>
      `;


      view.innerHTML =
        html;

      return;
    }


    /* QUEUE */

    if (step.queue) {

      let html =
        '<div class="queue-view">';


      step.queue.forEach(
        value => {

          html += `
            <div class="queue-item">
              ${value}
            </div>
          `;
        }
      );


      html +=
        "</div>";


      html += `
        <div style="
          margin-top:8px;
          font-size:11px;
          color:#697386;
        ">
          FRONT → QUEUE → REAR
        </div>
      `;


      view.innerHTML =
        html;

      return;
    }


    /* LINKED LIST */

    if (step.list) {

      let html =
        '<div class="array-view">';


      step.list.forEach(
        (value, index) => {

          html += `
            <div class="array-item">
              ${value}
            </div>
            ${
              index < step.list.length - 1
                ? "<span>→</span>"
                : "<span>→ NULL</span>"
            }
          `;
        }
      );


      html +=
        "</div>";


      view.innerHTML =
        html;

      return;
    }


    /* TREE */

    if (step.tree) {

      let html =
        '<div class="array-view">';


      step.tree.forEach(
        (value, index) => {

          const active =
            step.active &&
            step.active.includes(index);


          html += `
            <div class="array-item
              ${active ? "active" : ""}
            ">
              ${value}
            </div>
          `;
        }
      );


      html +=
        "</div>";


      view.innerHTML =
        html;

      return;
    }


    /* GRAPH */

    if (step.graph) {

      let html =
        '<div class="array-view">';


      step.graph.forEach(
        (node, index) => {

          const active =
            step.active &&
            step.active.includes(index);


          html += `
            <div class="array-item
              ${active ? "active" : ""}
            ">
              ${node}
            </div>
          `;
        }
      );


      html +=
        "</div>";


      view.innerHTML =
        html;

      return;
    }


    view.textContent =
      "No algorithm-specific data detected.";
  }


  /* ============================================================
     RENDER STEP
     ============================================================ */

  function renderStep(index) {

    if (!steps.length) {
      return;
    }


    currentStep =
      Math.max(
        0,
        Math.min(
          index,
          steps.length - 1
        )
      );


    const step =
      steps[currentStep];


    $("stepCounter").textContent =
      `Step ${currentStep + 1} of ${steps.length}`;


    const stage =
      getStage(step);


    flowNodes.forEach(
      (node, index) => {

        node.classList.remove(
          "active",
          "done"
        );


        if (index < stage) {
          node.classList.add("done");
        }


        if (index === stage) {
          node.classList.add("active");
        }

      }
    );


    const percent =
      steps.length === 1
        ? 100
        :
        (
          currentStep /
          (steps.length - 1)
        ) * 100;


    $("timelineFill").style.width =
      percent + "%";


    $("stepTitle").textContent =
      step.title ||
      "Execution step";


    $("stepDescription").textContent =
      step.description ||
      "Executing program logic.";


    $("lineRef").textContent =
      "Line: " +
      (step.line ?? "—");


    $("stepType").textContent =
      "Type: " +
      (step.type || "process");


    $("currentType").textContent =
      step.type ||
      "process";


    $("happening").textContent =
      step.description ||
      step.title ||
      "Executing program.";


    let variableText =
      `algorithm = ${detectedAlgorithm}\n`;


    if (detectedData.length) {

      variableText +=
        `data = [${detectedData.join(", ")}]\n`;
    }


    if (step.low !== undefined) {

      variableText +=
        `low = ${step.low}\n`;
    }


    if (step.mid !== undefined) {

      variableText +=
        `mid = ${step.mid}\n`;
    }


    if (step.high !== undefined) {

      variableText +=
        `high = ${step.high}\n`;
    }


    if (
      step.target !== undefined &&
      step.target !== null
    ) {

      variableText +=
        `target = ${step.target}\n`;
    }


    if (step.stack) {

      variableText +=
        `stack = [${step.stack.join(", ")}]\n`;
    }


    if (step.queue) {

      variableText +=
        `queue = [${step.queue.join(", ")}]\n`;
    }


    if (step.list) {

      variableText +=
        `list = [${step.list.join(", ")}]\n`;
    }


    $("variables").textContent =
      variableText;


    renderDSA(step);
  }

  /* ============================================================
     PLAYBACK
     ============================================================ */

  function stopPlayback() {

    if (playTimer) {

      clearInterval(
        playTimer
      );

      playTimer = null;
    }


    $("play").textContent =
      "▶ Play";
  }


  function playTrace() {

    stopPlayback();


    if (
      currentStep >=
      steps.length - 1
    ) {

      currentStep = 0;

      renderStep(
        currentStep
      );
    }


    $("play").textContent =
      "⏸ Pause";


    playTimer =
      setInterval(
        () => {

          if (
            currentStep >=
            steps.length - 1
          ) {

            stopPlayback();

            return;
          }


          renderStep(
            currentStep + 1
          );

        },
        Number(
          $("speed").value
        )
      );
  }


  $("play").addEventListener(
    "click",
    () => {

      if (playTimer) {
        stopPlayback();
      } else {
        playTrace();
      }

    }
  );


  $("next").addEventListener(
    "click",
    () => {

      stopPlayback();

      renderStep(
        currentStep + 1
      );
    }
  );


  $("prev").addEventListener(
    "click",
    () => {

      stopPlayback();

      renderStep(
        currentStep - 1
      );
    }
  );


  $("speed").addEventListener(
    "change",
    () => {

      if (playTimer) {
        playTrace();
      }
    }
  );

  /* ============================================================
     PYTHON / PYODIDE
     ============================================================ */

  let pyodidePromise = null;


  async function getPyodide() {

    if (!pyodidePromise) {

      if (!window.loadPyodide) {

        await new Promise(
          (resolve, reject) => {

            const script =
              document.createElement(
                "script"
              );


            script.src =
              "https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js";


            script.onload =
              resolve;


            script.onerror =
              reject;


            document.head.appendChild(
              script
            );

          }
        );
      }


      pyodidePromise =
        window.loadPyodide();
    }


    return pyodidePromise;
  }


  async function runPython(code) {

    const pyodide =
      await getPyodide();


    let captured = "";


    pyodide.setStdout({
      batched:
        text => {
          captured +=
            text + "\n";
        }
    });


    await pyodide.runPythonAsync(
      code
    );


    return captured.trim();
  }


  /* ============================================================
     JAVASCRIPT EXECUTION
     ============================================================ */

  async function runJavaScript(code) {

    return new Promise(
      (resolve, reject) => {

        const iframe =
          document.createElement(
            "iframe"
          );


        iframe.style.display =
          "none";


        document.body.appendChild(
          iframe
        );


        let output = "";


        const win =
          iframe.contentWindow;


        win.console.log =
          (...args) => {

            output +=
              args
                .map(String)
                .join(" ") +
              "\n";
          };


        try {

          const result =
            win.eval(code);


          if (
            result !== undefined &&
            !output
          ) {

            output =
              String(result);
          }


          setTimeout(
            () => {

              iframe.remove();

              resolve(
                output.trim()
              );

            },
            50
          );


        } catch (error) {

          iframe.remove();

          reject(error);
        }

      }
    );
  }


  /* ============================================================
     BACKEND EXECUTION
     ============================================================ */

  async function executeBackend(
    code,
    language
  ) {

    const controller =
      new AbortController();


    const timeout =
      setTimeout(
        () => controller.abort(),
        20000
      );


    try {

      const response =
        await fetch(
          TRACE_BACKEND +
          "/api/execute",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              language,
              code,
              stdin: ""
            }),

            signal:
              controller.signal
          }
        );


      const text =
        await response.text();


      let data;


      try {

        data =
          JSON.parse(text);

      } catch {

        data = {
          output: text
        };
      }


      /*
        IMPORTANT:
        Keep stderr/stdout from
        the backend.
      */

      if (!response.ok) {

        const error =
          new Error(
            data.error ||
            data.message ||
            data.stderr ||
            "Backend execution failed."
          );


        error.backendData =
          data;


        throw error;
      }


      if (
        data.error &&
        !data.output &&
        !data.stdout
      ) {

        const error =
          new Error(
            data.error
          );


        error.backendData =
          data;


        throw error;
      }


      return {

        output:
          data.output ??
          data.stdout ??
          "",

        stderr:
          data.stderr ??
          "",

        stdout:
          data.stdout ??
          data.output ??
          "",

        runtime:
          data.runtime ??
          "",

        executionTime:
          data.executionTime ??
          "",

        memoryUsed:
          data.memoryUsed ??
          ""

      };

    } finally {

      clearTimeout(timeout);
    }
  }


  /* ============================================================
     FORMAT BACKEND ERROR
     ============================================================ */

  function formatExecutionError(
    error
  ) {

    const data =
      error?.backendData;


    let message =
      error?.message ||
      String(error);


    if (
      data?.stderr
    ) {

      message =
        "stderr:\n" +
        data.stderr;

    } else if (
      data?.output
    ) {

      message =
        "Program output:\n" +
        data.output;
    }


    if (
      error?.name ===
      "AbortError"
    ) {

      message =
        "The backend took too long to respond.\n\n" +
        "Render may be waking up or the execution service may be busy.";
    }


    return message;
  }


  /* ============================================================
     MAIN RUN FUNCTION
     ============================================================ */

  async function runProgram() {

    stopPlayback();


    runBtn.disabled =
      true;


    runBtn.textContent =
      "⏳ Running…";


    outputEl.textContent =
      "Analyzing program…";


    statusEl.textContent =
      "● Analyzing code…";


    const code =
      codeEl.value;


    const language =
      languageEl.value;


    /* EMPTY CODE */

    if (!code.trim()) {

      outputEl.textContent =
        "Please enter some code.";


      statusEl.textContent =
        "● No code";


      runBtn.disabled =
        false;


      runBtn.textContent =
        "▶ Analyze & visualize";


      return;
    }


    /* ==========================================================
       LANGUAGE MISMATCH CHECK
       ========================================================== */

    const mismatch =
      detectLanguageMismatch(
        code,
        language
      );


    if (mismatch) {

      outputEl.textContent =
        "⚠ " + mismatch;


      statusEl.textContent =
        "● Execution blocked — language mismatch";


      runBtn.disabled =
        false;


      runBtn.textContent =
        "▶ Analyze & visualize";


      return;
    }


    try {

      /* ========================================================
         BUILD DYNAMIC TRACE
         ======================================================== */

      steps =
        buildTrace(code);


      currentStep =
        0;


      updateAlgorithmInfo();


      renderStep(0);


      /* ========================================================
         EXECUTE REAL PROGRAM
         ======================================================== */

      statusEl.textContent =
        "● Executing " +
        language.toUpperCase() +
        "…";


      /*
        HTML
      */

      if (
        language === "html"
      ) {

        runPreview();

        statusEl.textContent =
          "● Execution complete";

      }


      /*
        CSS
      */

      else if (
        language === "css"
      ) {

        runPreview();

        statusEl.textContent =
          "● Execution complete";
      }


      /*
        PYTHON
      */

      else if (
        language === "python"
      ) {

        const result =
          await runPython(code);


        outputEl.textContent =
          result ||
          "(Program finished with no output.)";


        statusEl.textContent =
          "● Execution complete";
      }


      /*
        JAVASCRIPT
      */

      else if (
        language === "javascript"
      ) {

        const result =
          await runJavaScript(code);


        outputEl.textContent =
          result ||
          "(Program finished with no output.)";


        statusEl.textContent =
          "● Execution complete";
      }


      /*
        REMOTE LANGUAGES

        C
        C++
        Java
        Go
        Kotlin
        Swift
        Ruby
        PHP
        Perl
        Bash
        SQL
      */

      else {

        const result =
          await executeBackend(
            code,
            language
          );


        /*
          SHOW STDERR IF COMPILER
          OR RUNTIME ERROR OCCURRED
        */

        if (
          result.stderr &&
          result.stderr.trim()
        ) {

          outputEl.textContent =
            "stderr:\n" +
            result.stderr;


          statusEl.textContent =
            "● Execution failed";


          return;
        }


        outputEl.textContent =
          result.output ||
          "(Program finished with no output.)";


        statusEl.textContent =
          "● Execution complete";
      }


      /*
        Keep visualization at
        first step after execution.
      */

      renderStep(0);


    } catch (error) {

      console.error(error);


      const message =
        formatExecutionError(
          error
        );


      outputEl.textContent =
        "✕ Execution error\n\n" +
        message;


      statusEl.textContent =
        "● Execution failed";


      /*
        The visualization can
        still be inspected even
        when compilation fails.
      */

      if (!steps.length) {

        steps =
          createGenericSteps(code);
      }


      currentStep =
        0;


      updateAlgorithmInfo();

      renderStep(0);


    } finally {

      runBtn.disabled =
        false;


      runBtn.textContent =
        "▶ Analyze & visualize";
    }
  }


  runBtn.addEventListener(
    "click",
    runProgram
  );


  /* ============================================================
     RESET
     ============================================================ */

  resetBtn.addEventListener(
    "click",
    () => {

      stopPlayback();


      codeEl.value =
        DEFAULT_CODE;


      languageEl.value =
        "cpp";


      updateFilename();

      updateLineNumbers();


      steps = [];

      currentStep = 0;

      detectedAlgorithm =
        "Generic Program";

      detectedData = [];

      detectedTarget =
        null;


      outputEl.textContent =
        "● Ready";


      statusEl.textContent =
        "● Ready";


      $("algorithmName").textContent =
        "Generic Program";


      $("logicName").textContent =
        "Generic Program";


      $("logicDescription").textContent =
        "TraceLab will inspect the program and create a general execution flow.";


      $("stepCounter").textContent =
        "Step 1 of 5";


      $("stepTitle").textContent =
        "Start program";


      $("stepDescription").textContent =
        "TraceLab begins analyzing your program.";


      $("lineRef").textContent =
        "Line: —";


      $("stepType").textContent =
        "Type: start";


      $("currentType").textContent =
        "Program Start";


      $("happening").textContent =
        "Execution begins. The code is being inspected.";


      $("variables").textContent =
        "program = started";


      $("dsaView").textContent =
        "No algorithm-specific data detected.";


      flowNodes.forEach(
        (node, index) => {

          node.classList.remove(
            "active",
            "done"
          );


          if (index === 0) {

            node.classList.add(
              "active"
            );
          }

        }
      );


      $("timelineFill").style.width =
        "0%";


      $("preview").style.display =
        "none";


      /*
        Rebuild initial trace.
      */

      steps =
        buildTrace(
          DEFAULT_CODE
        );


      detectedAlgorithm =
        detectAlgorithm(
          DEFAULT_CODE
        );


      updateAlgorithmInfo();

      renderStep(0);
    }
  );


  /* ============================================================
     KEYBOARD TAB SUPPORT
     ============================================================ */

  codeEl.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Tab"
      ) {

        event.preventDefault();


        const start =
          codeEl.selectionStart;


        const end =
          codeEl.selectionEnd;


        codeEl.value =
          codeEl.value.substring(
            0,
            start
          ) +
          "  " +
          codeEl.value.substring(
            end
          );


        codeEl.selectionStart =
          codeEl.selectionEnd =
            start + 2;


        updateLineNumbers();
      }

    }
  );


  /* ============================================================
     INITIAL TRACE
     ============================================================ */

  steps =
    buildTrace(
      codeEl.value
    );


  updateAlgorithmInfo();

  renderStep(0);

</script>
